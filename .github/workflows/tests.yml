name: Cars CRUD Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          
      - name: Install requirements
        run: cd cars-crud && python -m pip install -r requirements-dev.txt
        
      - name: Install Chromium and its Linux dependencies
        run: cd cars-crud && python -m playwright install --with-deps chromium
        
      - name: Run unit tests
        run: cd cars-crud && python -m pytest tests/unit -q
        
      - name: Run integration tests
        run: cd cars-crud && python -m pytest tests/integration -q
        
      - name: Run API tests
        run: cd cars-crud && python -m pytest tests/api -q
        
      - name: Run E2E tests
        run: cd cars-crud && python -m pytest tests/e2e -q
